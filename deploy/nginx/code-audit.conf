server {
    listen 80;
    server_name audit.overme.cn;

    root /opt/code-audit-platform/frontend/dist;
    index index.html;

    location ^~ /api/ {
        # Keep the /api prefix: the Flask routes are registered under /api/*.
        # Do not add a trailing slash to proxy_pass.
        proxy_pass http://127.0.0.1:5088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
