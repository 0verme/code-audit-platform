# Inner-network DWS JDBC template. Copy to backend/configs/database.yaml on the deployment host.
# ${NAME} values are expanded from the process environment; do not commit actual credentials.
default_profile: inner_dws

profiles:
  inner_dws:
    type: dws
    host: ${AUDIT_DWS_HOST}
    port: ${AUDIT_DWS_PORT}
    database: ${AUDIT_DWS_DATABASE}
    username: ${AUDIT_DWS_USER}
    password: ${AUDIT_DWS_PASSWORD}
    schema: ${AUDIT_DWS_SCHEMA}
    # jdbc_url is optional when the legacy host/port/database/schema values above are set.
    # jdbc_url: jdbc:gaussdb://dws.example.internal:8000/code_audit?currentSchema=dwp
    driver: com.huawei.gauss200.jdbc.Driver
    jar_path: backend/resources/jars/gaussdb200.jar
    connect_timeout: 10
    socket_timeout: 30
    statement_timeout_ms: 30000
