# Database configuration template. Copy to backend/configs/database.yaml on the
# deployment host and fill in real values.  Do not commit backend/configs/database.yaml.
#
# All database roles are configured here — no environment variables needed.
#   default_profile   — runtime (read/write) database
#   metadata_profile  — read-only audit metadata (optional; defaults to runtime)
#   partition_profile — partition-metadata queries (optional; defaults to metadata
#                        then runtime)
#
# Each named profile under `profiles` can be any supported type:
#   postgresql | dws

default_profile: inner_dws

# Optional: override with a different profile for read-only audit metadata.
# metadata_profile: local_pg

# Optional: dedicated profile for partition-metadata queries (dba_tab_partitions).
# partition_profile: dev_partition_dws

# Optional: restrict startup to a specific database profile.
#   inner      — inner-network DWS (requires profile "inner_dws" with type "dws")
#   production — production DWS (requires profile "inner_dws" with type "dws")
# deployment_mode: inner

profiles:
  inner_dws:
    type: dws
    host: 10.1.1.123
    port: 25308
    database: dws_db
    username: audit_app
    password: change_me
    schema: dwp
    # jdbc_url is optional when host/port/database/schema above are set.
    # jdbc_url: jdbc:gaussdb://dws.example.internal:8000/code_audit?currentSchema=dwp
    driver: com.huawei.gauss200.jdbc.Driver
    jar_path: backend/resources/jars/gaussdb200.jar
    connect_timeout: 10
    socket_timeout: 30
    statement_timeout_ms: 30000
    # Metadata SQL uses only validated identifiers from this profile mapping.
    metadata:
      schema: dwp
      partition_catalog: true
      tables:
        jobs: p_job_hjj
        programs: p_program_hjj
        plans: p_plan_hjj
        roles: p_role_hjj
        fine: p_fine_hjj
        job_outfiles: p_job_outfile
      columns:
        jobs: {plan_name: a, sequence_name: b, job_name: c, program_key: e, status: x, dependencies: ab}
        programs: {program_key: b, result_table: k}

  # Optional read-only PostgreSQL metadata mirror. Runtime writes remain on inner_dws.
  local_pg:
    type: postgresql
    host: 127.0.0.1
    port: 5432
    database: code_audit
    username: audit_app
    password: change_me
    schema: dwp
    connect_timeout: 5
    statement_timeout_ms: 30000
    metadata:
      schema: dwp
      # This mirror has no dba_tab_partitions; partition queries fall back.
      partition_catalog: false
      tables:
        jobs: p_job_hjj
        programs: p_program_hjj
        plans: p_plan_hjj
        roles: p_role_hjj
        fine: p_fine_hjj
        job_outfiles: p_job_outfile
        para_tables: p_para_table_lists
        field_mapping: p_field_mapping_table
        upstream_system: p_upstream_system
      columns:
        jobs: {plan_name: a, sequence_name: b, job_name: c, program_key: e, status: x, dependencies: ab}
        programs: {program_key: b, result_table: k}
