# Non-secret audit business rules. Copy to audit_rules.yaml to override defaults.
# Do not put SQL, passwords, tokens, connection strings, or arbitrary paths here.
display:
  highlight_result_source_systems:
    - 押品管理系统
    - 移动贷后
    - IPC智能微贷平台
    - 风险预警报送系统
    - 线下智能风控系统
    - 统一授信系统
    - 信贷管理系统
  calendar_labels:
    SYS_MONTH_END_CALENDAR: 每月末
    SYS_EVERYDAY_CALENDAR: 每日
hcyt:
  schedule:
    real_job_plan_names: []
    allowed_domains:
      - EDWS_DOMAIN
      - CMS_DOMAIN
      - NOVA_DOMAIN
      - CBSRUN_DOMAIN
      - IS_DOMAIN
      - EXPORT_DOMAIN
    realtime_priority_values: ["99", "99.0"]
    description_validation:
      min_meaningful_chinese_chars: 2
      noise_phrases:
        - 数据装载加工作业
        - 数据预处理作业
        - 实时数据供应
        - 数据采集作业
        - 数据加工作业
        - 数据装载作业
        - 数据供应作业
        - 国结模型表
        - 监管集市
        - 数据供应
        - 加工表
        - 接入表
        - 新国结表
        - 模型层
        - 贴源层
        - 拉链表
        - 预处理
        - 新国结
        - 国结表
        - 待补充
        - 待完善
        - 实时
        - 卸数
        - 全量
        - 增量
        - 拉链
        - 装载
        - 采集
        - 作业
        - 加工
        - 数据
        - 国结
        - 测试
        - 描述
        - 说明
        - 暂无
        - 默认
        - 同上
        - 未知
        - F层
        - SEND
      invalid_values:
        - "null"
        - "none"
        - "n/a"
        - "na"
        - "todo"
        - "tbd"
        - "audit sample"
        - "test"
        - "description"
        - 无
        - 暂无
        - 无描述
        - 暂无描述
        - 待补充
        - 待完善
        - 同上
        - 默认
        - 未知
dws:
  naming:
    schema_prefixes: {DWF: [F_], DWM: [M_], DWA: [A_], DWP: [P_], DWD: [RMD_]}
    temporary_table_prefixes: [TMP_]
    comment_required_schemas: [DWF, DWM, DWA, DWP, DWD]
    root_check_required_schemas: [DWM, DWA, DM]
    asset_review_required_schemas: [DWM, DWA, DM]
  sql_review:
    legacy_markers:
      - {value: WLQ, excludes: []}
      - {value: LZY, excludes: [RLZY]}
      - {value: BSC, excludes: []}
      - {value: YGW, excludes: []}
      - {value: TMPQS, excludes: []}
    protected_code_tables:
      - DWM.M_PUB_CODE_MAP_NEW
      - DWM.M_PUB_CODE_INFO_NEW
      - DWM.M_PUB_CODE_USE_NEW
nups:
  file_rules:
    sql_filenames: [] # Empty keeps conservative scanning of all .sql files.
fine_report:
  file_conventions:
    menu_filename: menu.txt
    authority_filename: authority.txt
    template_extensions: [.cpt, .frm]
audit_input:
  included_extensions: [.cpt, .frm, .txt, .xls, .sql, .sh, .py, .json]
  file_categories: [] # Empty uses the built-in business classification map.
workflows:
  default: hcyt
  definitions:
    - id: hcyt
      path_keywords: ["/hcyt/", hcyt, "湖仓"]
source_display_rules: []
