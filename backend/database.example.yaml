# Inner-network DWS template. Copy to database.yaml on the deployment host.
# ${NAME} values are expanded from the process environment; missing values fail startup.
default_profile: inner_dws

profiles:
  inner_dws:
    type: dws
    host: ${AUDIT_DWS_HOST}
    port: ${AUDIT_DWS_PORT}
    database: ${AUDIT_DWS_DATABASE}
    username: ${AUDIT_DWS_USER}
    password: ${AUDIT_DWS_PASSWORD}
    schema: ${AUDIT_DWS_SCHEMA}
    connect_timeout: 10
    statement_timeout_ms: 30000
    application_name: code-audit-platform
    sslmode: require
