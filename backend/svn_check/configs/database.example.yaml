# Unified database profile template.
# Copy this file to database.yaml and keep only PostgreSQL or only DWS as the active profile.
# Runtime tables and metadata queries always use the same profile.

default_profile: local_pg

profiles:
  local_pg:
    type: postgresql
    host: 127.0.0.1
    port: 5432
    database: code_audit
    username: demo_user
    password: demo_password
    schema: dwp

  local_dws:
    type: dws
    host: 127.0.0.1
    port: 8000
    database: code_audit
    username: demo_user
    password: demo_password
    schema: dwp
