# Database connection template for the rule metadata service.
# Copy this file to database.yaml in your deployment environment and fill real values.
# Do not commit real usernames, passwords, tokens, internal IPs, or production DSNs.
#
# Environment variables can override this file:
#   SVN_CHECK_DB_BACKEND
#   SVN_CHECK_PG_HOST / SVN_CHECK_PG_PORT / SVN_CHECK_PG_DB
#   SVN_CHECK_PG_USER / SVN_CHECK_PG_PASSWORD / SVN_CHECK_PG_SCHEMA

# Supported values: postgres | gaussdb
backend: postgres

# ---- Postgres metadata database ----
postgres:
  host: 127.0.0.1
  port: 5432
  dbname: demo_db
  user: demo_user
  password: demo_password
  schema: dwp

# ---- Optional GaussDB over JDBC ----
defaults:
  driver: com.example.jdbc.Driver
  jar_path: /path/to/resources/jars/gaussdb200.jar

profiles:
  demo:
    jdbc_url: jdbc:gaussdb://db.example.com:5432/demo_db?currentSchema=dwp
    user: demo_user
    password: demo_password
