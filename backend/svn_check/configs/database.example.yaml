# 数据库连接配置模板。
# 复制为 database.yaml 并填入真实连接信息（database.yaml 已被 .gitignore 忽略，不入库）。
#   cp database.example.yaml database.yaml
# 也可不落盘，全部用环境变量覆盖：
#   SVN_CHECK_DB_BACKEND / SVN_CHECK_PG_HOST/PORT/DB/USER/PASSWORD/SCHEMA

# 数据库后端选择：postgres | gaussdb（可被环境变量 SVN_CHECK_DB_BACKEND 覆盖）
backend: postgres

# ---- Postgres（测试环境）----
postgres:
  host: 127.0.0.1
  port: 5432
  dbname: your_db
  user: your_user
  password: your_password
  schema: dwp

# ---- GaussDB（行内生产，经 JDBC 桥）----
defaults:
  driver: com.huawei.gauss200.jdbc.Driver
  jar_path: /path/to/resources/jars/gaussdb200.jar

profiles:
  czcb:
    jdbc_url: jdbc:gaussdb://HOST:PORT/DBNAME?currentSchema=SCHEMA
    user: your_user
    password: your_password
